[package]
name = "flamework_rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Flamework's transformer as a compiled-in rbxts-rs plugin. F0: the parts that need no compiler; F1: the plugin with ids, decorators, build infos and the include JSON; F2: user macros, intrinsics and macro types; F3: guards; F4: the serializer."

# Every byte-exact library it needs (hashids, uuid v5, sha1/sha256, JSON with JavaScript's property order,
# minimatch-style globs) is ported in `src/`, with parity tables generated from the node libraries in `tests/data`.
# F1 adds the plugin API (`rbxts_plugin`), the Luau tree, the project services and tsrs's AST and checker.
[features]
# Parity tooling only: `FLAMEWORK_RS_LAYOUT_DUMP` names a file every versioned serializer's layout text and hash are
# appended to (`serializer::dump_layout`). Off in every normal build.
layout-dump = []
# Test tooling only: `FLAMEWORK_RS_WIRE_DIR` names a folder every serializer, network decoder and packed call site is
# also written to as a standalone Luau module, for `tools/wirediff` (`serializer::wire`). Off in every normal build.
wire-harvest = []

[dependencies]
dragonbox_ecma.workspace = true
rbxts_plugin.workspace = true
rbxts_luau.workspace = true
rbxts_project.workspace = true
tsrs_core.workspace = true
tsrs_ast.workspace = true
tsrs_checker.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The end-to-end test builds fixtures with the real compiler (`compile_project_with`).
rbxts_transform.workspace = true
# The diagnostics table test prints a build's diagnostics as `rbxtsc-fw` does (`rbxts_cli::format_diagnostic`).
rbxts_cli.workspace = true
tsrs_compiler.workspace = true
tsrs_diagnostics.workspace = true
